<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نتيجة المبادرة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0b2a5b; --blue:#0f4fb8; --sky:#e8f0fc; --card:#ffffff; --bg:#f3f7fd;
  --text:#0b2a5b; --muted:#4b5f85; --red:#d4202a; --red-bg:#fde8ea; --red-line:#f3a3a8;
  --note-bg:#e3ecfb; --foot:#0b2250; --orange:#f5a623;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --card:#132244; --bg:#0a1530; --text:#eaf1ff; --muted:#a9bbe0; --sky:#1a2c57;
    --red:#ff6b73; --red-bg:#3a1a24; --red-line:#7d3340; --note-bg:#1a2c57;
  }
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:'Cairo',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
header{background:var(--card);display:flex;align-items:center;justify-content:space-between;padding:14px 32px;gap:12px;box-shadow:0 2px 10px rgba(11,42,91,.08);flex-wrap:wrap;border-radius:0 0 22px 22px;position:relative;z-index:2}
.brand{font-weight:800;font-size:24px;letter-spacing:.5px;line-height:1.1}
.brand small{display:block;font-weight:600;font-size:11px;color:var(--muted)}
.logo-slot{min-width:120px;height:44px;padding:0 12px;border:1.5px dashed var(--muted);border-radius:10px;display:grid;place-items:center;font-size:12px;color:var(--muted);font-weight:600}
nav{display:flex;gap:22px;align-items:center;font-size:15px;color:var(--muted);font-weight:600}
nav .active{background:var(--navy);color:#fff;padding:9px 22px;border-radius:999px}
main{flex:1;position:relative;overflow:hidden;padding:70px 16px 50px;margin-top:-22px;
  background:linear-gradient(160deg,#0a3f9e 0%,#1a63d6 45%,#e9f1fd 45.2%,var(--bg) 100%)}
.stage{max-width:1250px;margin:0 auto;display:grid;grid-template-columns:1fr minmax(0,700px) 1fr;align-items:center;gap:20px}
.side-r{color:#fff;text-align:right;transform:rotate(-4deg)}
.side-r h3{margin:0;font-size:38px;font-weight:800;line-height:1.2}
.side-r p{margin:2px 0 8px;font-size:22px;font-weight:600}
.side-r i{display:block;width:170px;height:5px;border-radius:5px;background:var(--orange);transform:rotate(-3deg)}
.side-l svg{width:100%;max-width:300px;display:block;margin-inline:auto}
.card{width:100%;background:var(--card);border-radius:28px;padding:64px 36px 28px;position:relative;text-align:center;box-shadow:0 20px 50px rgba(11,42,91,.22)}
.badge{position:absolute;top:-44px;left:50%;transform:translateX(-50%);width:92px;height:92px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:0 6px 20px rgba(11,42,91,.15)}
.badge svg{width:48px;height:48px}
h1{margin:0 0 6px;font-size:34px;font-weight:800}
.sub{margin:0 0 22px;color:var(--muted);font-weight:600}
.field{display:flex;align-items:center;gap:10px;border:1.5px solid var(--sky);background:var(--bg);border-radius:999px;padding:0 20px;height:56px}
.field:focus-within{border-color:var(--blue);outline:3px solid rgba(15,79,184,.25)}
.field input{flex:1;border:0;background:transparent;font:inherit;font-size:18px;font-weight:600;color:var(--text);text-align:center;outline:none;min-width:0}
.field svg{width:22px;height:22px;fill:var(--muted)}
.hint{margin:8px 0 0;font-size:13px;color:var(--muted)}
.btn{margin-top:14px;border:0;cursor:pointer;background:var(--blue);color:#fff;font:inherit;font-weight:700;font-size:18px;padding:0 44px;height:52px;border-radius:999px;display:inline-flex;align-items:center;gap:10px}
.btn:hover{background:#0b3f98}
.btn:focus-visible{outline:3px solid var(--navy);outline-offset:3px}
.btn[disabled]{opacity:.7;cursor:wait}
#out{margin-top:30px}
.result{border:1.5px solid #f2d08a;background:#fff6e0;border-radius:18px;padding:34px 20px 22px;position:relative;animation:pop .45s cubic-bezier(.2,1.2,.4,1)}
.result .x{position:absolute;top:-24px;left:50%;transform:translateX(-50%);width:48px;height:48px;border-radius:50%;background:#f5a623;color:#fff;display:grid;place-items:center;font-size:28px;font-weight:800;border:4px solid var(--card)}
.result h2{margin:0;color:#9a5b00;font-size:32px;font-weight:800}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .result{background:#3a2e14;border-color:#7d6120}:root:not([data-theme="light"]) .result h2{color:#ffc766}}
.result .who{margin:0 0 6px;color:var(--muted);font-weight:600}
.result p{margin:6px 0 0;font-weight:600}
.spin{width:34px;height:34px;border:4px solid var(--sky);border-top-color:var(--blue);border-radius:50%;margin:10px auto;animation:r .8s linear infinite}
.err{color:var(--red);font-weight:600;margin:0}
.note{margin-top:20px;background:var(--note-bg);color:var(--muted);border-radius:999px;padding:12px 18px;font-size:14px;font-weight:600}
footer{background:var(--foot);color:#fff;padding:20px 32px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-weight:600}
.soc{display:flex;gap:12px}
.soc span{width:38px;height:38px;border-radius:50%;background:#fff;color:var(--foot);display:grid;place-items:center;font-weight:800;font-size:14px}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
@keyframes r{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.result,.spin{animation:none}}
@media (max-width:980px){.stage{grid-template-columns:1fr}.side-l{display:none}.side-r{order:-1;text-align:center;transform:none;margin-bottom:34px}.side-r i{margin-inline:auto}.side-r h3{font-size:28px}.side-r p{font-size:18px}}
@media (max-width:560px){header{padding:12px 14px}nav{gap:10px;font-size:13px}.card{padding:60px 18px 22px}h1{font-size:28px}.result h2{font-size:30px}footer{justify-content:center}}
</style>
</head>
<body>
<header>
  <div class="brand">مبادرة ديجي<small>لصنّاع المحتوى الرقمي</small></div>
  <nav><span>عن المبادرة</span><span class="active">النتيجة</span></nav>
</header>

<main>
  <div class="stage">
    <div class="side-l" aria-hidden="true">
      <svg viewBox="0 0 300 260" fill="none">
        <path d="M150 20c-22 0-38 16-38 36 0 14 8 22 14 30 4 5 5 9 5 14h38c0-5 1-9 5-14 6-8 14-16 14-30 0-20-16-36-38-36z" fill="#ffd45a"/>
        <path d="M138 108h24v10h-24z" fill="#c9d6ee"/>
        <g stroke="#f5a623" stroke-width="4" stroke-linecap="round"><path d="M112 22l-8-10M188 22l8-10M95 52l-12-3M205 52l12-3"/></g>
        <path d="M50 170l30-62h150l30 62z" fill="#3b4f86"/>
        <rect x="74" y="112" width="152" height="86" rx="8" fill="#1b2f6b"/>
        <path d="M134 140l-16 15 16 15M166 140l16 15-16 15M156 136l-12 38" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M40 202h220l-14 18H54z" fill="#b8c4e6"/>
      </svg>
    </div>

    <section class="card">
      <div class="badge" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none" stroke="#0b2a5b" stroke-width="3" stroke-linecap="round"><rect x="9" y="8" width="26" height="34" rx="4"/><path d="M16 4h12v8H16zM15 22h14M15 29h9"/><circle cx="35" cy="36" r="9" fill="#f5a623" stroke="#fff"/><path d="M35 31v6M35 40.5v.5" stroke="#fff"/></svg>
      </div>
      <h1>نتيجة المبادرة</h1>
      <p class="sub">يرجى إدخال اسمك الثلاثي لعرض النتيجة</p>
      <div class="field">
        <input id="name" type="text" placeholder="الاسم الثلاثي" autocomplete="off" aria-label="الاسم الثلاثي">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4.4 0-8 2.2-8 5v2h16v-2c0-2.8-3.6-5-8-5z"/></svg>
      </div>
      <button class="btn" id="go" type="button">
        عرض النتيجة
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      </button>
      <div id="out" aria-live="polite"></div>
    </section>

    <div class="side-r">
      <h3>مبادرة ديجي</h3>
      <i></i>
    </div>
  </div>
</main>

<footer>
  <div class="soc" aria-hidden="true"><span>YT</span><span>f</span><span>IG</span><span>in</span></div>
  <div class="logo-slot" id="logo-footer" style="border-color:#a9bbe0;color:#a9bbe0">مكان اللوجو</div>
</footer>

<script>
(function(){
  var input=document.getElementById('name'), btn=document.getElementById('go'), out=document.getElementById('out');
  function esc(s){return s.replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  // مكان الربط بالداتا بيز: ضيف هنا كود حفظ الاسم (مثلاً Supabase insert)
  function saveName(fullName){ /* TODO: database call */ }
  function show(){
    var n=input.value.trim().replace(/\s+/g,' ');
    var words=n?n.split(' '):[];
    if(words.length!==3){
      out.innerHTML='<p class="err">لازم تكتب الاسم الثلاثي (ثلاث كلمات بالظبط).</p>';
      input.focus();return;
    }
    btn.disabled=true;
    out.innerHTML='<div class="spin" role="status" aria-label="جاري التحميل"></div>';
    saveName(n);
    setTimeout(function(){
      out.innerHTML='<div class="result"><div class="x" aria-hidden="true">!</div><p class="who">'+esc(n)+'</p><h2>النتيجة لم تظهر بعد</h2><p>يرجى المحاولة مرة أخرى لاحقًا</p></div>';
      btn.disabled=false;
    },1400);
  }
  btn.addEventListener('click',show);
  input.addEventListener('keydown',function(e){if(e.key==='Enter')show();});
})();
</script>
</body>
</html>
